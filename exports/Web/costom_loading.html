<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Cat Burgler Game</title>
    <style>
        body {
            background-color: #5d4037; /* brown bg */
            color: #d7ccc8; /* light brown text */
            font-family: Arial, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        #canvas {
            display: block;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        #status-progress {
            width: 300px;
            height: 10px;
            background: #3e2723; /* dark brown */
            border-radius: 5px;
            overflow: hidden;
        }
        #status-progress-inner {
            height: 100%;
            width: 0%;
            background: #8d6e63; /* brown */
            transition: width 0.3s ease;
        }
        #status-notice {
            margin-top: 10px;
            font-size: 14px;
            color: #d7ccc8;
        }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
</head>
<body>
    <canvas id="canvas">Your browser does not support the canvas tag.</canvas>
    <noscript>Your browser does not support JavaScript.</noscript>
    <div id="status">
        <div id="status-progress">
            <div id="status-progress-inner"></div>
        </div>
        <div id="status-notice">Loading...</div>
    </div>
    <script src="index.js"></script>
    <script>
        const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":0,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1854764,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":0};
        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);
        (function () {
            const statusProgress = document.getElementById('status-progress-inner');
            const statusNotice = document.getElementById('status-notice');
            engine.startGame({
                'onProgress': function (current, total) {
                    if (total > 0) {
                        statusProgress.style.width = `${(current / total) * 100}%`;
                    }
                },
            }).then(() => {
                document.getElementById('status').style.display = 'none';
            }, (err) => {
                statusNotice.textContent = err;
            });
        }());
    </script>
</body>
</html>

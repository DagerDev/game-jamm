name: Export Godot Web  
  
on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    timeout-minutes: 10 
  
    permissions:  
      contents: write  
  
    steps:  
      - uses: actions/checkout@v4  
  
      - name: Setup Godot  
        run: |  
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip  
          unzip Godot_v4.6-stable_linux.x86_64.zip  
          chmod +x Godot_v4.6-stable_linux.x86_64  
  
      - name: Setup export templates  
        run: |  
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable/  
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz  
          unzip Godot_v4.6-stable_export_templates.tpz  
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/  

      # Clean up any cached/corrupted importer files that might have been pushed to Git
      - name: Clean Cache
        run: |
          rm -rf .godot/
          rm -rf .import/

      # Run import with --verbose so we can see what it's doing in the logs
      - name: Import Assets
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --quit --verbose || true
  
      # Run export with --verbose
      - name: Export Web  
        run: |  
          mkdir -p build  
          ./Godot_v4.6-stable_linux.x86_64 --headless \  
          --path . \  
          --export-release "Web" build/index.html --verbose  
  
      - name: Deploy  
        uses: peaceiris/actions-gh-pages@v4  
        with:  
          github_token: ${{ secrets.GITHUB_TOKEN }}  
          publish_dir: build
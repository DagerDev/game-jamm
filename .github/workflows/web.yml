name: Export Godot Web

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Godot
      # -----------------------------
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q Godot_v4.6-stable_linux.x86_64.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          mv Godot_v4.6-stable_linux.x86_64 godot

      # -----------------------------
      # Setup Export Templates
      # -----------------------------
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable/
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q Godot_v4.6-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/

      # -----------------------------
      # Verify project exists
      # -----------------------------
      - name: Validate project
        run: |
          if [ ! -f "project.godot" ]; then
            echo "ERROR: project.godot not found in repo root"
            exit 1
          fi

      # -----------------------------
      # Export Web
      # -----------------------------
      - name: Export Web Build
        run: |
          mkdir -p build

          ./godot --headless --path . \
            --export-release "Web" build/index.html

      # -----------------------------
      # Deploy to GitHub Pages
      # -----------------------------
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build